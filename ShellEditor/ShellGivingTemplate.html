<script>
(function(){
  function wrapOf(node){
    if(!node) return null;
    if(node.classList&&node.classList.contains('she-bg-media')) return node;
    return node.parentNode&&node.parentNode.classList&&
      node.parentNode.classList.contains('she-bg-media') ? node.parentNode : null;
  }
  window.__sheBgMediaReveal=function(node){
    var el=wrapOf(node);
    if(!el||el.getAttribute('data-she-fading')) return;
    el.setAttribute('data-she-fading','1');
    // Wait a beat so the first decoded frame can paint inside the embed.
    setTimeout(function(){
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          el.classList.add('she-bg-media-ready');
          try{ el.style.removeProperty('opacity'); }catch(e){ el.style.opacity=''; }
        });
      });
    }, 250);
  };
  function vimeoPost(frame, payload){
    try{ frame.contentWindow.postMessage(JSON.stringify(payload), '*'); }catch(e){}
  }
  function youtubeListen(frame){
    try{
      var w=frame.contentWindow;
      w.postMessage(JSON.stringify({event:'listening', id:'she-bg'}), '*');
      w.postMessage('{"event":"command","func":"addEventListener","args":["onStateChange"]}', '*');
    }catch(e){}
  }
  // Called from iframe onload — only wires APIs; does NOT fade in yet.
  window.__sheBgMediaEmbedLoad=function(frame){
    var el=wrapOf(frame);
    if(!el||!frame) return;
    var kind=(el.getAttribute('data-she-bg-kind')||'').toLowerCase();
    if(kind==='youtube'){
      youtubeListen(frame);
      setTimeout(function(){ youtubeListen(frame); }, 400);
      setTimeout(function(){ youtubeListen(frame); }, 1200);
    } else if(kind==='vimeo'){
      vimeoPost(frame, {method:'addEventListener', value:'play'});
      vimeoPost(frame, {method:'addEventListener', value:'playing'});
      vimeoPost(frame, {method:'addEventListener', value:'timeupdate'});
      vimeoPost(frame, {method:'getCurrentTime'});
    }
  };
  window.addEventListener('message', function(ev){
    var origin=(ev.origin||'').toLowerCase();
    var data=ev.data;
    if(typeof data==='string'){
      try{ data=JSON.parse(data); }catch(e){ return; }
    }
    if(!data||typeof data!=='object') return;
    var el=document.querySelector('.she-bg-media');
    if(!el) return;
    var frame=el.querySelector('.she-bg-media-frame');
    if(!frame) return;
    var kind=(el.getAttribute('data-she-bg-kind')||'').toLowerCase();
    if(kind==='vimeo' && origin.indexOf('vimeo.com')>=0){
      if(data.event==='ready'){
        vimeoPost(frame, {method:'addEventListener', value:'play'});
        vimeoPost(frame, {method:'addEventListener', value:'playing'});
        vimeoPost(frame, {method:'addEventListener', value:'timeupdate'});
        vimeoPost(frame, {method:'getCurrentTime'});
      }
      if(data.event==='play' || data.event==='playing'){
        window.__sheBgMediaReveal(frame); return;
      }
      if(data.event==='timeupdate' && data.data && data.data.seconds>0.05){
        window.__sheBgMediaReveal(frame); return;
      }
      if(data.method==='getCurrentTime' && typeof data.value==='number' && data.value>0.05){
        window.__sheBgMediaReveal(frame); return;
      }
    }
    if(kind==='youtube' && (origin.indexOf('youtube.com')>=0 || origin.indexOf('youtube-nocookie.com')>=0)){
      // 1 = playing
      if(data.event==='onStateChange' && data.info===1){
        window.__sheBgMediaReveal(frame); return;
      }
      if(data.event==='infoDelivery' && data.info && data.info.playerState===1){
        window.__sheBgMediaReveal(frame); return;
      }
      if(data.event==='onReady' || data.event==='initialDelivery'){
        youtubeListen(frame);
      }
    }
  });
  var el=document.querySelector('.she-bg-media');
  if(!el) return;
  var src=(el.getAttribute('data-she-bg-src')||'').trim();
  if(!src || el.hasAttribute('hidden')) return;
  var frame=el.querySelector('.she-bg-media-frame');
  if(!frame) return;
  var kind=(el.getAttribute('data-she-bg-kind')||'').toLowerCase();
  if(frame.tagName==='VIDEO' || kind==='file'){
    if(!frame.paused && frame.readyState>=2) window.__sheBgMediaReveal(frame);
    frame.addEventListener('playing', function(){ window.__sheBgMediaReveal(frame); }, {once:true});
    setTimeout(function(){ window.__sheBgMediaReveal(frame); }, 8000);
    return;
  }
  // Embeds: never fade on iframe load — wait for play messages above.
  if(frame.tagName==='IFRAME'){
    window.__sheBgMediaEmbedLoad(frame);
    frame.addEventListener('load', function(){ window.__sheBgMediaEmbedLoad(frame); }, {once:true});
  }
  // Last-resort fallback if the host blocks postMessage events.
  setTimeout(function(){ window.__sheBgMediaReveal(frame); }, 10000);
})();
</script>

	/* =================== GIVING FORM LAYOUT ==================== */
	/* Structural rules NOT exposed in Shell Editor. Keep these so Bootstrap's
	   .container does not cap width (breaks pledge / recurring tables), and so
	   toggle / wallet chrome keep intended spacing. Colors, fonts, and button
	   looks inherit from the FORM CSS marker until edited in the Shell Editor. */

	.container {
		box-sizing: border-box !important;
		width: 100% !important;
		max-width: none !important;
		padding-left: 0 !important;
		padding-right: 0 !important;
	}

	/* One-Time / Recurring / Pledge pills — shared padding (not in editor). */
	.container .give-type .btn {
		padding: 8px 30px !important;
	}

	/* Card / Bank / etc. chooser — shared padding (not in editor). */
	.container .payment-type .btn,
	.container .payment-type-selection > .btn {
		padding: 8px 30px !important;
	}

	/* Saved payment rows are clickable. */
	.container .payment-list .list-group-item {
		cursor: pointer !important;
	}

	/* Person icon — always Font Awesome (name text styles must not override the glyph). */
	.container .btn-link:not(.btn-sm) .fa-user,
	.container .btn-link:not(.btn-sm) .fa-user:before,
	.container .btn-link:not(.btn-sm) .fa,
	.container .btn-link:not(.btn-sm) .fa:before,
	.container .btn-link:not(.btn-sm) .fas,
	.container .btn-link:not(.btn-sm) .fas:before {
		font-family: FontAwesome, "Font Awesome 5 Free", "Font Awesome 6 Free" !important;
		font-weight: 900 !important;
		font-style: normal !important;
		color: inherit !important;
		background: none !important;
		background-color: transparent !important;
		border: none !important;
		border-width: 0 !important;
	}

	/* Sign-in panel chrome (not exposed in editor). */
	.container .signin-form .well {
		background-color: #f9f9f9 !important;
	}

	/* ===== My Recurring Giving: column reflow (not exposed in editor) ===== */
	/* Only reflow at the desktop breakpoint where col-md-* applies */
	@media (min-width: 992px) {
		.container .recurring-management .table-headers,
		.container .recurring-management .show-border {
			display: flex !important;
			flex-wrap: nowrap !important;
			align-items: center !important;
			width: 100% !important;
		}

		/* neutralize Bootstrap's float + fixed width on every cell */
		.container .recurring-management .table-headers > div,
		.container .recurring-management .show-border > div {
			float: none !important;
			width: auto !important;
			min-width: 0 !important;
			box-sizing: border-box !important;
			white-space: nowrap !important;
			overflow: hidden !important;
			text-overflow: ellipsis !important;
			padding-right: 8px !important;
		}

		/* 1 = Fund, 2 = Amount, 3 = Frequency, 4 = Payment, 5 = Actions */
		.container .recurring-management .table-headers > div:nth-child(1),
		.container .recurring-management .show-border   > div:nth-child(1) { flex: 0 0 15% !important; }
		.container .recurring-management .table-headers > div:nth-child(2),
		.container .recurring-management .show-border   > div:nth-child(2) { flex: 0 0 15% !important; }
		.container .recurring-management .table-headers > div:nth-child(3),
		.container .recurring-management .show-border   > div:nth-child(3) { flex: 0 0 30% !important; }
		.container .recurring-management .table-headers > div:nth-child(4),
		.container .recurring-management .show-border   > div:nth-child(4) { flex: 0 0 22% !important; }
		.container .recurring-management .table-headers > div:nth-child(5),
		.container .recurring-management .show-border   > div:nth-child(5) { flex: 0 0 18% !important; }

		/* keep the edit-mode money input inside the Amount cell */
		.container .recurring-management .small-money-input,
		.container .recurring-management .small-money-input input {
			width: 100% !important;
			max-width: 100% !important;
			min-width: 0 !important;
			box-sizing: border-box !important;
		}
	}

	/* ===== Pledge summary: stacked cards with labels on mobile (not in editor) ===== */
	@media (max-width: 991px) {
		/* Stack the table into full-width blocks */
		.container .pledge-summary table,
		.container .pledge-summary tbody,
		.container .pledge-summary tr,
		.container .pledge-summary td {
			display: block !important;
			width: 100% !important;
		}

		/* Hide the header row (matches recurring section, which drops its headers) */
		.container .pledge-summary th {
			display: none !important;
		}

		/* Each data row becomes a bordered card (matches .show-border on mobile) */
		.container .pledge-summary tr {
			border: 1px solid lightgrey !important;
			margin-bottom: 5px !important;
			text-align: left !important;
		}

		/* Value cells: left-align and give room for the stacked label */
		.container .pledge-summary td {
			text-align: left !important;
			padding: 4px 10px !important;
		}

		/* Stack the label ABOVE the value */
		.container .pledge-summary td::before {
			display: block !important;
			font-weight: bold !important;
			font-size: 12px !important;
			opacity: 0.8 !important;
		}

		/* ---- 6-column RECURRING pledge table ---- */
		.container .pledge-summary table:has(td:nth-child(6)) td:nth-child(1)::before { content: "Fund" !important; }
		.container .pledge-summary table:has(td:nth-child(6)) td:nth-child(2)::before { content: "Amount" !important; }
		.container .pledge-summary table:has(td:nth-child(6)) td:nth-child(3)::before { content: "Frequency" !important; }
		.container .pledge-summary table:has(td:nth-child(6)) td:nth-child(4)::before { content: "Pledged to Date" !important; }
		.container .pledge-summary table:has(td:nth-child(6)) td:nth-child(5)::before { content: "Contributed to Date" !important; }
		.container .pledge-summary table:has(td:nth-child(6)) td:nth-child(6)::before { content: "" !important; }

		/* ---- 4-column NON-RECURRING pledge table ---- */
		.container .pledge-summary table:not(:has(td:nth-child(5))) td:nth-child(1)::before { content: "Fund" !important; }
		.container .pledge-summary table:not(:has(td:nth-child(5))) td:nth-child(2)::before { content: "Pledged to Date" !important; }
		.container .pledge-summary table:not(:has(td:nth-child(5))) td:nth-child(3)::before { content: "Contributed to Date" !important; }
